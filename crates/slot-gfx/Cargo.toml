[package]
name = "slot-gfx"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host"]
host = ["dep:glutin", "dep:glutin-winit", "dep:winit", "dep:raw-window-handle"]
device = []
flip = []
# Framebuffer + CPU rasteriser, for a device with no GPU. Replaces the GL
# backend rather than sitting beside it.
software = ["dep:libc"]
# Software-framebuffer surface for GPU-less Miyoo devices (Mini Plus).
miyoomini = ["software"]
test-support = []

[dependencies]
gl = { workspace = true }
libloading = { workspace = true }
libc = { workspace = true, optional = true }
glutin = { workspace = true, optional = true }
glutin-winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[[example]]
name = "flip_smoke"
required-features = ["flip"]
