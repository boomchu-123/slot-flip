name: experimental

# Trial integration builds only. Publishing remains manual until complete core
# bundles are reproducibly staged and the combined port is checked on hardware.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.slug }} pak (experimental)
    runs-on: ubuntu-latest
    container: rust:${{ matrix.rust_container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: miyoomini
            feature: miyoomini
            rust_container: 1-buster
            max_glibc: 2.28
          - slug: my282
            feature: my282
            rust_container: 1-bullseye
            max_glibc: 2.17
            zig: true
    steps:
      - uses: actions/checkout@v7

      - name: Install cross tools
        env:
          RUST_CONTAINER: ${{ matrix.rust_container }}
        run: |
          set -eu
          if [ "$RUST_CONTAINER" = 1-buster ]; then
            sed -i -e 's|deb.debian.org/debian buster|archive.debian.org/debian buster|g' \
              -e 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' \
              -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
              /etc/apt/sources.list
          else
            sed -i '/bullseye-security/d' /etc/apt/sources.list
          fi
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            zip file binutils gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Install zig
        if: matrix.zig
        run: |
          set -eu
          apt-get install -y --no-install-recommends xz-utils
          mkdir -p /opt/zig
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz |
            tar -xJ -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.20.1 --locked

      - name: Build frontend
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          USE_ZIG: ${{ matrix.zig }}
          FEATURE: ${{ matrix.feature }}
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: |
          set -eu
          if [ "$USE_ZIG" = true ]; then
            cargo zigbuild --release -p slot --no-default-features --features "$FEATURE" \
              --target "armv7-unknown-linux-gnueabihf.$MAX_GLIBC" --target-dir target-exp
          else
            cargo build --release -p slot --no-default-features --features "$FEATURE" \
              --target armv7-unknown-linux-gnueabihf --target-dir target-exp
          fi

      - name: Assemble and validate complete pak
        env:
          SLUG: ${{ matrix.slug }}
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: |
          set -eu
          pak="flip/Tools/$SLUG/Slot.pak"
          cp target-exp/armv7-unknown-linux-gnueabihf/release/slot "$pak/slot"
          chmod +x "$pak/slot" "$pak/launch.sh"
          printf '%s %s %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$SLUG" > "$pak/slot.version"
          sh -n "$pak/launch.sh"
          for binary in slot System/mgba_libretro.so System/gpsp_libretro.so \
            System/pcsx_rearmed_libretro.so System/fceumm_libretro.so \
            System/snes9x2005_plus_libretro.so System/genesis_plus_gx_libretro.so; do
            test -f "$pak/$binary" || { echo "Missing $binary; refusing an incomplete pak" >&2; exit 1; }
            file "$pak/$binary" | grep -q 'ELF 32-bit.*ARM'
            required="$(readelf --version-info "$pak/$binary" |
              grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)"
            test -n "$required"
            awk -v got="$required" -v max="$MAX_GLIBC" 'BEGIN {
              split(got, g, "."); split(max, m, ".")
              exit !((g[1] < m[1]) || (g[1] == m[1] && g[2] <= m[2]))
            }'
          done
          if strings "$pak/slot" | grep -q 'software renderer not yet implemented'; then
            echo 'Obsolete Mini Plus probe in frontend' >&2
            exit 1
          fi
          sh tools/check-pak-licences.sh "$pak"

      - name: Package
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set -eu
          stage="$(mktemp -d)"
          cp -R "flip/Tools/$SLUG/Slot.pak" "$stage/Slot.pak"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/Slot.pak-$SLUG.zip" Slot.pak)

      - uses: actions/upload-artifact@v7
        with:
          name: Slot.pak-${{ matrix.slug }}.zip
          path: Slot.pak-${{ matrix.slug }}.zip
          if-no-files-found: error
