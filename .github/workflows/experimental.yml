name: experimental

# Builds the EXPERIMENTAL Miyoo Mini Plus (miyoomini) pak and publishes it as a
# GitHub pre-release. Kept entirely separate from the stable Flip release
# workflow (release.yml): different branch (experimental), different tag pattern
# (exp-v*), and always marked --prerelease so it never shows as "Latest".
#
# The Mini Plus has no GPU, so this build does not draw to the screen yet — it
# probes the hardware and writes slot.log. See TESTERS.md.

on:
  push:
    tags: ['exp-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.slug }} pak (experimental)
    runs-on: ubuntu-latest
    container: rust:${{ matrix.rust_container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Miyoo Mini Plus — no GPU, software renderer is TODO (probe only).
          # Its firmware is based on glibc 2.28, so use the matching sysroot.
          - slug: miyoomini
            feature: miyoomini
            rust_container: 1-buster
            max_glibc: 2.28
          # Miyoo A30 — Mali-400 GPU, uses the existing GLES renderer.
          - slug: my282
            feature: my282
            rust_container: 1-bullseye
            max_glibc: 2.31
    steps:
      - uses: actions/checkout@v7

      - name: Install cross tools
        env:
          RUST_CONTAINER: ${{ matrix.rust_container }}
        run: |
          set -eu
          if [ "$RUST_CONTAINER" = 1-buster ]; then
            sed -i -e 's|deb.debian.org/debian buster|archive.debian.org/debian buster|g' \
              -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
              /etc/apt/sources.list
          fi
          apt-get -o Acquire::Check-Valid-Until=false update
          # gcc-arm-linux-gnueabihf is the cross compiler; libc6-dev-armhf-cross
          # provides the target CRT objects (Scrt1.o, crti.o) and libc the linker
          # needs. Without the latter, linking fails with "cannot find Scrt1.o".
          apt-get install -y --no-install-recommends \
            zip gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Build the ${{ matrix.slug }} frontend (armhf, experimental)
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          set -eu
          cargo build --release -p slot --no-default-features --features ${{ matrix.feature }} \
            --target armv7-unknown-linux-gnueabihf --target-dir target-exp

      - name: Assemble Slot.pak
        run: |
          set -eu
          pak="flip/Tools/${{ matrix.slug }}/Slot.pak"
          cp target-exp/armv7-unknown-linux-gnueabihf/release/slot "$pak/slot"
          chmod +x "$pak/slot" "$pak/launch.sh"
          # Must be 32-bit ARM (Cortex-A7), not aarch64.
          file "$pak/slot" | grep -q "ELF 32-bit.*ARM"
          test -x "$pak/launch.sh"
          # Reject a binary linked above the device's firmware glibc baseline.
          max_glibc="${{ matrix.max_glibc }}"
          required_glibc="$(readelf --version-info "$pak/slot" |
            sed -n 's/.*GLIBC_\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' |
            sort -Vu | tail -1)"
          test -n "$required_glibc"
          printf 'slot requires glibc %s (maximum %s)\n' "$required_glibc" "$max_glibc"
          awk -v got="$required_glibc" -v max="$max_glibc" 'BEGIN {
            split(got, g, ".")
            split(max, m, ".")
            exit !((g[1] < m[1]) || (g[1] == m[1] && g[2] <= m[2]))
          }'

      - name: Package
        id: package
        run: |
          set -eu
          stage="$(mktemp -d)"
          cp -R flip/Tools/${{ matrix.slug }}/Slot.pak "$stage/Slot.pak"
          zip="Slot.pak-${{ matrix.slug }}.zip"
          ( cd "$stage" && zip -qry "$GITHUB_WORKSPACE/$zip" Slot.pak )
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Slot.pak-miyoomini.zip

      - uses: actions/download-artifact@v8
        with:
          name: Slot.pak-my282.zip

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > notes.md <<'NOTES'
          **EXPERIMENTAL pre-releases. Not the stable Flip build, and not
          working yet. Testers wanted — see TESTERS.md.**

          For the working Miyoo Flip release, see the latest `v*` release.

          ---

          **`Slot.pak-my282.zip` — Miyoo A30 (`my282`).** The A30 has a Mali-400
          GPU, so this uses slot's real GLES renderer and has a chance of
          working — but it is **unverified on hardware** and ships without armhf
          cores. The default button map is a best guess and may be wrong (fixable
          via `Config/buttons.ini`). Please share `slot.log` (and
          `input-trace.log` with a `DEBUG` file).

          **`Slot.pak-miyoomini.zip` — Miyoo Mini Plus (`miyoomini`). Does not
          draw yet.** The Mini Plus has no GPU, so the graphics path is a work in
          progress; this build only probes the hardware and writes `slot.log`.
          Do not expect it to play games.

          ---

          A fork of slot by Brandon T. Kowalski (https://slot-cfw.fyi). Not
          affiliated with the upstream author or Nintendo.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            Slot.pak-my282.zip Slot.pak-miyoomini.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "slot-flip $GITHUB_REF_NAME (Miyoo A30 + Mini Plus, experimental)" \
            --notes-file notes.md \
            --prerelease
