name: release

# Builds the Miyoo Flip (my355) frontend for the tag and publishes a ready-to-use
# Slot.pak-my355.zip. The emulator cores in Slot.pak/System/ are committed, so CI
# only has to build the `slot` binary and package everything up.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: flip pak
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v7

      - name: Install zip
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list || true
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip

      - name: Build the Flip frontend (aarch64)
        run: |
          set -eu
          cargo build --release -p slot --no-default-features --features flip --target-dir target-flip

      - name: Assemble Slot.pak
        run: |
          set -eu
          pak="flip/Tools/my355/Slot.pak"
          cp target-flip/release/slot "$pak/slot"
          chmod +x "$pak/slot" "$pak/launch.sh"
          # Sanity-check the same things a user would trip over.
          file "$pak/slot" | grep -q aarch64
          file "$pak/System/mgba_libretro.so" | grep -q aarch64
          file "$pak/System/gpsp_libretro.so" | grep -q aarch64
          file "$pak/System/pcsx_rearmed_libretro.so" | grep -q aarch64
          file "$pak/System/fceumm_libretro.so" | grep -q aarch64
          file "$pak/System/snes9x2005_plus_libretro.so" | grep -q aarch64
          file "$pak/System/genesis_plus_gx_libretro.so" | grep -q aarch64
          test -x "$pak/launch.sh"
          sh tools/check-pak-licences.sh "$pak"
          test -f "$pak/System/licenses/gpsp-GPL-2.0.txt"
          test -f "$pak/System/licenses/mgba-MPL-2.0.txt"
          test -f "$pak/System/licenses/gpsp-src.tar.gz"
          test -f "$pak/System/licenses/pcsx-GPL-2.0.txt"
          test -f "$pak/System/licenses/pcsx-src.tar.gz"
          test -f "$pak/System/licenses/pcsx_rearmed_libretro.so.meta"

      - name: Package
        id: package
        run: |
          set -eu
          # Two shapes from one tree:
          #   Slot-my355.zip     unzip at the card root: App/Slot for the stock
          #                      launcher and Tools/my355/Slot.pak for MinUI.
          #   Slot.pak-my355.zip the pak alone, for people who already copy it
          #                      into Tools/my355 by hand.
          stage="$(mktemp -d)"
          mkdir -p "$stage/Tools/my355"
          cp -R flip/Tools/my355/Slot.pak "$stage/Tools/my355/Slot.pak"
          cp -R flip/App "$stage/App"
          ( cd "$stage" && zip -qry "$GITHUB_WORKSPACE/Slot-my355.zip" App Tools )
          unzip -l Slot-my355.zip | grep -q "App/Slot/config.json"
          unzip -l Slot-my355.zip | grep -q "Tools/my355/Slot.pak/launch.sh"
          unzip -l Slot-my355.zip | grep -q "snes9x2005_plus_libretro.so"
          unzip -l Slot-my355.zip | grep -q "NOTICE-NONCOMMERCIAL.txt"

          stage2="$(mktemp -d)"
          cp -R flip/Tools/my355/Slot.pak "$stage2/Slot.pak"
          ( cd "$stage2" && zip -qry "$GITHUB_WORKSPACE/Slot.pak-my355.zip" Slot.pak )
          unzip -l Slot.pak-my355.zip | grep -q snes9x2005_plus_libretro.so
          unzip -l Slot.pak-my355.zip | grep -q genesis_plus_gx_libretro.so
          unzip -l Slot.pak-my355.zip | grep -q NOTICE-NONCOMMERCIAL.txt

          # Optional: boot straight into Slot on the Flip's own firmware. Separate
          # because it replaces the card's copy of the launcher entry, and not
          # everyone wants a device that starts in one app.
          stage3="$(mktemp -d)"
          cp -R flip/autoboot/miyoo355 "$stage3/miyoo355"
          ( cd "$stage3" && zip -qry "$GITHUB_WORKSPACE/Slot-autoboot-my355.zip" miyoo355 )
          unzip -l Slot-autoboot-my355.zip | grep -q "miyoo355/app/MainUI"

          echo "zip=Slot-my355.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: |
            Slot-my355.zip
            Slot.pak-my355.zip
            Slot-autoboot-my355.zip
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Slot-my355.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > notes.md <<'NOTES'
          Miyoo Flip (my355) build of slot.

          **Install:** unzip `Slot-my355.zip` at the **root of your SD card**. It
          puts `App/Slot` (the Flip's own launcher, App list) and
          `Tools/my355/Slot.pak` (MinUI's Tools menu) in place, so whichever
          launcher you use finds it. Full guide in the README.

          `Slot.pak-my355.zip` is the pak on its own, for people who already copy
          it into `Tools/my355/` by hand.

          `Slot-autoboot-my355.zip` is optional: unzip it too and the Flip boots
          straight into Slot instead of a menu (stock firmware). To get the menu
          back, create an empty file `Slot/Config/boot-menu` and reboot.

          Emulation by mGBA (MPL-2.0), gpSP, PCSX-ReARMed and fceumm (GPL-2.0)
          snes9x2005 and Genesis Plus GX (both non-commercial: this download is
          free and must not be sold). Their licences, patches and source are in
          `System/licenses/`.

          A fork of slot by Brandon T. Kowalski (https://slot-cfw.fyi). Not
          affiliated with the upstream author or Nintendo. Use your own
          legally-dumped ROMs.
          NOTES
          gh release create "$GITHUB_REF_NAME" Slot-my355.zip Slot.pak-my355.zip \
            Slot-autoboot-my355.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "slot-flip $GITHUB_REF_NAME (Miyoo Flip)" \
            --notes-file notes.md
