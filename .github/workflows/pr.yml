name: pr

# Runs on every pull request so branch protection can require a green check
# before anything merges. This is deliberately read-only (no secrets, no write
# token): forked PRs can run it, but can't do anything with it.

on:
  pull_request:
    branches: [flip, experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7

      - name: Check the pak ships only cleared emulator cores
        run: sh tools/check-pak-licences.sh flip/Tools/my355/Slot.pak

      - name: Test the PR review tool
        run: python3 tools/test_review_pr.py

      - name: Test the installer
        run: sh tools/test-install-slot.sh

      - name: Test the ARM attribute repair
        run: python3 -B cores/test_armv7_attributes.py

      - name: Test the Mini Plus App handoff
        run: sh tools/test-miyoomini-app.sh

      - name: Install build deps
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            libudev-dev libasound2-dev pkg-config

      - name: Check the device builds compile
        run: |
          set -eu
          # Each target is behind its own feature; make sure none regressed.
          # Only check features that exist on the branch under test (the
          # experimental device features are not on `flip` yet).
          for feat in flip miyoomini my282; do
            if grep -qE "^${feat} = " crates/slot/Cargo.toml; then
              echo "::group::feature $feat"
              cargo check -p slot --no-default-features --features "$feat" --target-dir "target-$feat"
              echo "::endgroup::"
            else
              echo "skip $feat (not present on this branch)"
            fi
          done

      - name: Run tests
        run: |
          set -eu
          # Runs in the container as root. Don't chown the runner's own mounts —
          # that breaks its post-job cleanup.
          for c in slot slot-store slot-power slot-input slot-ui slot-retro slot-gfx; do
            echo "::group::lib $c"
            cargo test -p "$c" --lib --target-dir target-test
            echo "::endgroup::"
          done

          echo "::group::integration"
          cargo test -p slot-store -p slot-power -p slot-ui --tests --target-dir target-test
          cargo test -p slot --test evdev --test input --test platform --target-dir target-test
          echo "::endgroup::"

          # The Flip's own input code is behind the `flip` feature, which the suite
          # above does not enable, so some of it was never tested: the Flip never
          # opened its power button's node, and its left stick never drove the
          # d-pad, and neither showed up anywhere. Run the unit tests with it on,
          # plus the one integration test that names the power node. (The rest of
          # the evdev integration suite assumes the generic map and does not pass
          # under `flip`.)
          echo "::group::flip"
          cargo test -p slot --no-default-features --features flip --lib --target-dir target-test
          cargo test -p slot --no-default-features --features flip --test evdev \
            the_node_carrying_only_the_power_key_is_opened --target-dir target-test
          echo "::endgroup::"
